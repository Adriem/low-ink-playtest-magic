name: Idea or improvement
description: Something the app could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's missing or gets in the way, and for whom. Start from the need rather than the solution.
    validations:
      required: true
  - type: textarea
    id: ideas
    attributes:
      label: Ideas
      description: Ways to solve it, and their trade-offs. Mention what you've already tried or ruled out.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we'll know it's solved.
      placeholder: |
        - Users can ...
        - The app still ...
