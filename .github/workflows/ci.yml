name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only reads the code
permissions:
  contents: read

# A newer push to a pull request cancels the checks still running for the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
