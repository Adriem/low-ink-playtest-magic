<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The favicon: an SVG, inverted in dark mode, where SVG favicons are supported, else PNGs for each mode
      and an ICO, exported from it with https://favicon.io/svg-favicon/ (in light and dark mode)
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" media="(prefers-color-scheme: light)" />
    <link
      rel="icon"
      href="/favicon-32x32-dark.png"
      type="image/png"
      sizes="32x32"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon-16x16-dark.png"
      type="image/png"
      sizes="16x16"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Create ready-to-print, low-ink Magic: The Gathering™ playtest cards. Printer ink is expensive; playtesting shouldn't be."
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />
    <title>Low-ink Playtest Magic</title>
    <!-- How links to the site show where they're shared (e.g. Reddit, Discord): absolute URLs, as those sites ask -->
    <link rel="canonical" href="https://adriem.github.io/low-ink-mtg-press/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Low-ink Playtest Magic" />
    <meta property="og:title" content="Low-ink Playtest Magic" />
    <meta
      property="og:description"
      content="Create ready-to-print, low-ink Magic: The Gathering™ playtest cards. Printer ink is expensive; playtesting shouldn't be."
    />
    <meta property="og:url" content="https://adriem.github.io/low-ink-mtg-press/" />
    <meta property="og:image" content="https://adriem.github.io/low-ink-mtg-press/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Low-ink Playtest Magic: three playtest cards fanned out next to the site's name, Colossal Dreadmaw with high ink and its art, Shivan Dragon with medium ink and no art, and Counterspell in the minimalist style"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
